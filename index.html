<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>King Bob's Rescue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --plum: #211a2b; --plum-2: #2e2440; --plum-3: #45375c;
    --gold: #e8b94a; --parchment: #efe6d2; --muted: #b9adc9; --error: #ff9c8a;
  }
  html, body { height: 100%; margin: 0; background: var(--plum); }
  body {
    display: grid; place-items: center;
    padding-inline: 16px;
    color: var(--parchment);
    font: 16px/1.5 "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  form {
    width: 100%; max-width: 360px;
    display: grid; gap: 14px;
    padding: 28px 24px;
    border-radius: 14px;
    background: var(--plum-2);
    box-shadow: 0 0 0 2px var(--plum-3), 0 18px 40px rgba(0, 0, 0, .45);
  }
  h1 {
    margin: 0;
    font: 800 40px/1 "Grenze Gotisch", Georgia, serif;
    color: var(--gold);
    text-wrap: balance;
  }
  p { margin: 0; color: var(--muted); }
  label { display: grid; gap: 6px; font-weight: 700; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
  input[type="text"], input[type="password"] {
    font: 400 17px "Atkinson Hyperlegible", system-ui, sans-serif;
    color: var(--parchment);
    background: var(--plum);
    border: 1px solid var(--plum-3);
    border-radius: 8px;
    padding: 10px 12px;
  }
  input:focus-visible, button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
  .remember { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
  button {
    min-height: 46px;
    border: 0; border-radius: 23px;
    background: var(--gold); color: var(--plum);
    font: 700 16px "Atkinson Hyperlegible", system-ui, sans-serif;
  }
  button:disabled { opacity: .6; }
  #msg { min-height: 1.5em; font-size: 14px; color: var(--error); }
</style>
</head>
<body>
<form id="login" autocomplete="on">
  <h1>King Bob's Rescue</h1>
  <p>This is a private test build. Sign in with the username and password you were sent.</p>
  <label for="user">Username <input type="text" id="user" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
  <label for="pass">Password <input type="password" id="pass" name="password" autocomplete="current-password" required></label>
  <label class="remember" for="remember"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
  <button type="submit" id="go">Sign in</button>
  <div id="msg" role="alert"></div>
</form>

<script>
const DATA = JSON.parse(document.getElementById('locked').textContent);
const STORE = 'kingbob.key';
const subtle = crypto.subtle, enc = new TextEncoder();
const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const msg = document.getElementById('msg'), go = document.getElementById('go');

async function userId(name) {
  const digest = await subtle.digest('SHA-256', enc.encode('kingbob:' + name.trim().toLowerCase()));
  return [...new Uint8Array(digest)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function unwrapKey(entry, password) {
  const base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  const kek = await subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: bytes(entry.s), iterations: DATA.n },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  return new Uint8Array(await subtle.decrypt({ name: 'AES-GCM', iv: bytes(entry.i) }, kek, bytes(entry.k)));
}

async function openGame(rawKey) {
  const key = await subtle.importKey('raw', rawKey, 'AES-GCM', false, ['decrypt']);
  const page = await subtle.decrypt({ name: 'AES-GCM', iv: bytes(DATA.iv) }, key, bytes(DATA.c));
  document.open();
  document.write(new TextDecoder().decode(page));
  document.close();
}

function remember(rawKey) {
  try { localStorage.setItem(STORE, btoa(String.fromCharCode(...rawKey))); } catch (e) { /* storage unavailable */ }
}

async function signIn(ev) {
  ev.preventDefault();
  go.disabled = true; go.textContent = 'Checking…'; msg.textContent = '';
  const entry = DATA.u[await userId(document.getElementById('user').value)];
  try {
    const rawKey = await unwrapKey(entry || Object.values(DATA.u)[0], document.getElementById('pass').value);
    if (!entry) throw new Error('unknown user');
    if (document.getElementById('remember').checked) remember(rawKey);
    await openGame(rawKey);
  } catch (e) {
    msg.textContent = "That username and password don't match. Check them and try again.";
    go.disabled = false; go.textContent = 'Sign in';
  }
}

async function tryRemembered() {
  let saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) { return; }
  if (!saved) return;
  try { await openGame(bytes(saved)); }
  catch (e) { try { localStorage.removeItem(STORE); } catch (err) { /* storage unavailable */ } }
}

document.getElementById('login').addEventListener('submit', signIn);
tryRemembered();
</script>
